<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SETUPAI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 45%, #112233 0%, #09131d 65%, #060c12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      user-select: none;
    }

    .logo-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: #0d131a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      padding: 12px;
    }

    .logo-icon-inner {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background: linear-gradient(135deg, #4da6ff 0%, #c06cff 52%, #ff5fa2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon-inner span {
      font-size: 46px;
      font-weight: 800;
      color: #0b1016;
      line-height: 1;
      letter-spacing: -1px;
    }

    .brand-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ffffff;
      line-height: 1;
    }

    .brand-title .ai {
      background: linear-gradient(90deg, #5cc2ff 0%, #e072ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="splash-container" id="splash">
    <div class="logo-icon">
      <div class="logo-icon-inner">
        <span>S</span>
      </div>
    </div>
    <div class="brand-title">SETUP<span class="ai">AI</span></div>
  </div>
</body>
</html>
